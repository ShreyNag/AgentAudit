server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service when the frontend and backend run behind the same
    # origin (docker-compose.yml's "web" convenience service maps /api to the backend container).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx's default proxy_read_timeout (60s) fires as soon as it goes 60s without a new
        # byte from upstream -- fatal for POST /runs/{id}/evaluate, which blocks on ~10
        # concurrent Judge calls (app.evaluation.evaluators.registry.EvaluatorRegistry.run_all)
        # and sends nothing back until every one finishes. Against a local/slow provider (e.g.
        # Ollama) that single response routinely takes several minutes; nginx must never be the
        # shortest timeout in the chain. Matches the frontend's own evaluate()/launch() timeouts
        # (frontend/src/api/services/evaluation.ts, runs.ts) so neither is the bottleneck instead.
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
