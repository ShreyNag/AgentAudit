[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit-backend"
version = "0.1.0"
description = "AgentAudit backend: execution engine, evaluation engine, REST API, persistence."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

# Every entry below is either imported directly somewhere under app/ or alembic/ (verified by
# grepping the whole backend for "import"/"from" statements), or is required transitively by a
# feature of a direct dependency that we actually use -- each such case is annotated inline so a
# future audit doesn't mistake it for dead weight and remove it.
dependencies = [
    "fastapi~=0.115.0",
    "starlette~=0.37.2",              # imported directly in app/middleware/*.py, not just via fastapi
    "uvicorn[standard]~=0.30.0",
    "pydantic~=2.8.0",
    "pydantic-settings~=2.4.0",
    "python-dotenv~=1.0.1",            # pydantic-settings' env_file=(...) loading requires this at runtime
    "sqlalchemy~=2.0.32",
    "alembic~=1.13.2",
    "aiomysql~=0.2.0",                 # loaded by SQLAlchemy via the "mysql+aiomysql://" DSN scheme
    "cryptography~=43.0.0",            # required by aiomysql/PyMySQL for MySQL 8's caching_sha2_password auth
    "aiosqlite~=0.20.0",               # loaded by SQLAlchemy via the "sqlite+aiosqlite://" DSN scheme
    "httpx~=0.27.0",
    "tenacity~=9.0.0",
    "structlog~=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=5.0.0",               # provides the --cov flag used in [tool.pytest.ini_options]
    "respx~=0.21.1",                   # httpx mock transport, used by every provider adapter test
    "ruff~=0.6.9",
    "mypy~=1.11.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
